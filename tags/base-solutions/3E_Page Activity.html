<script>
// Script Name: 3E_Page Activity
// Author: Anthony Figgins
// Description: Tracks page engagement by sending Marketo visits at configurable intervals
// Version: 1.3.1
// Date Updated: 2025-09-26
// Dependencies: 3E Config, Marketo Munchkin

(function() {
  'use strict';
  
  // ===== CONFIGURATION SECTION =====
  // Modify these values as needed for different clients or requirements
  
  var CONFIG = {
    // Debug mode - uses 3E Config debugMode setting
    debugMode: false, // Will be overridden by 3E Config if available
    
    // Tracking toggles - set to false to disable specific tracking
    enableShortInterval: true,   // 2-second visit with current page URL
    enableLongInterval: true,   // 30-second visit with custom URL
    
    // Timing intervals (in seconds)
    shortIntervalSeconds: 2,    // How long to wait for short interval visit
    longIntervalSeconds: 30,    // How long to wait for long interval visit
    
    // Custom URL for long interval visit
    customUrl: 'https://3ereporting.com',
    
    // Max retries to wait for Munchkin (in 100ms intervals)
    maxRetries: 50  // 5 seconds max wait time
  };
  
  // ===== END CONFIGURATION SECTION =====
  
  // Get configuration from 3E Config
  var CFG; 
  try { 
    CFG = {{3E config}}; 
  } catch(_) { 
    CFG = null; 
  }
  
  // Override debug mode with 3E Config if available
  if (CFG && CFG.debugMode !== undefined) {
    CONFIG.debugMode = String(CFG.debugMode).toLowerCase() === 'true';
  }
  
  // Debug logging function
  function debugLog() {
    if (CONFIG.debugMode) {
      try {
        console.log.apply(console, ['[3E_Page Activity]'].concat(Array.prototype.slice.call(arguments)));
      } catch(_) {}
    }
  }
  
  // Check if Munchkin is available and ready
  function isMunchkinReady() {
    return typeof Munchkin !== 'undefined' && 
           Munchkin.munchkinFunction && 
           typeof Munchkin.munchkinFunction === 'function';
  }
  
  // Wait for Munchkin to be ready with retry logic
  function waitForMunchkin(callback) {
    var attempts = 0;
    
    function check() {
      attempts++;
      
      if (isMunchkinReady()) {
        debugLog('Munchkin ready after', attempts, 'attempts');
        callback();
      } else if (attempts < CONFIG.maxRetries) {
        debugLog('Waiting for Munchkin... attempt', attempts, 'of', CONFIG.maxRetries);
        setTimeout(check, 100);
      } else {
        debugLog('ERROR: Munchkin not available after', CONFIG.maxRetries, 'attempts');
        if (CONFIG.debugMode) {
          console.error('[3E_Page Activity] Munchkin not available. Check that 3E_Insights Pixel is loaded first.');
        }
      }
    }
    
    check();
  }
  
  // Send visit to Marketo with error handling
  function sendCustomVisit(url, params) {
    if (!isMunchkinReady()) {
      debugLog('ERROR: Munchkin not ready, skipping visit');
      return false;
    }
    
    var munchkinParams = {
      url: url,
      params: params
    };
    
    debugLog('Sending visit:', new Date().toISOString(), 'URL:', url, 'Params:', params);
    
    try {
      Munchkin.munchkinFunction('visitWebPage', munchkinParams);
      debugLog('Visit sent successfully');
      return true;
    } catch (e) {
      debugLog('ERROR: Failed to send visit:', e.message);
      return false;
    }
  }
  
  // Modify current URL according to requirements
  function modifyCurrentUrl() {
    var currentPageUrl = window.location.pathname;
    debugLog('Original page path:', currentPageUrl);
    
    try {
      // Remove .html extension if present
      if (currentPageUrl.endsWith('.html')) {
        currentPageUrl = currentPageUrl.substring(0, currentPageUrl.length - 5);
      }
      
      // Ensure URL starts with leading slash
      if (!currentPageUrl.startsWith('/')) {
        currentPageUrl = '/' + currentPageUrl;
      }
      
      debugLog('Modified page URL:', currentPageUrl);
      return currentPageUrl;
    } catch (e) {
      debugLog('ERROR: Failed to modify URL:', e.message);
      return '/error';
    }
  }
  
  // Extract and format query parameters
  function getQueryParams() {
    try {
      var searchParams = window.location.search.substring(1);
      var paramsArray = searchParams.split('&');
      var params = [];
      
      for (var i = 0; i < paramsArray.length; i++) {
        var param = paramsArray[i].trim();
        if (param) {
          params.push(param);
        }
      }
      
      var result = params.join('&');
      debugLog('Query parameters:', result);
      return result;
    } catch (e) {
      debugLog('ERROR: Failed to extract query params:', e.message);
      return '';
    }
  }
  
  // Initialize page activity tracking
  function initPageActivity() {
    debugLog('Initializing page activity tracking');
    debugLog('Configuration:', CONFIG);
    
    // Short interval visit (current page) - only if enabled
    if (CONFIG.enableShortInterval) {
      setTimeout(function() {
        try {
          var modifiedUrl = modifyCurrentUrl();
          var queryParams = getQueryParams();
          var params = queryParams ? queryParams + '&time=' + CONFIG.shortIntervalSeconds : 'time=' + CONFIG.shortIntervalSeconds;
          
          debugLog('Triggering', CONFIG.shortIntervalSeconds + '-second visit');
          sendCustomVisit(modifiedUrl, params);
        } catch (e) {
          debugLog('ERROR: Failed to send short interval visit:', e.message);
        }
      }, CONFIG.shortIntervalSeconds * 1000);
    } else {
      debugLog('Short interval tracking is disabled');
    }
    
    // Long interval visit (custom URL) - only if enabled
    if (CONFIG.enableLongInterval) {
      setTimeout(function() {
        try {
          debugLog('Triggering', CONFIG.longIntervalSeconds + '-second visit');
          sendCustomVisit(CONFIG.customUrl, 'time=' + CONFIG.longIntervalSeconds);
        } catch (e) {
          debugLog('ERROR: Failed to send long interval visit:', e.message);
        }
      }, CONFIG.longIntervalSeconds * 1000);
    } else {
      debugLog('Long interval tracking is disabled');
    }
  }
  
  // Start the script
  debugLog('Script loaded, waiting for Munchkin...');
  
  // Log script name and version on load (only in debug mode)
  if (CONFIG.debugMode) {
      console.log('[3E_Page Activity] v1.3.1');
  }
  
  waitForMunchkin(initPageActivity);
  
})();
</script>
