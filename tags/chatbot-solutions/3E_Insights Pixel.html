<script>
// Script Name: 3E_Insights Pixel
// Author: Anthony Figgins
// Description: Loads Marketo Munchkin tracking dynamically via 3E config.
// Version: 1.0.7
// Date Updated: 2025-09-26
// Dependencies: 3E Config
      
    var CFG; try { CFG = {{3E config}}; } catch(_) { CFG = null; }
    
    (function (w, d) {
      'use strict';
    
      // --- Values provided via 3E config variable ---
      var ACCT = (CFG && CFG.munchkinId) ? CFG.munchkinId : '';
      if (!ACCT) { console.error('[Munchkin] Missing munchkinId in 3E config'); return; }
      var WSINFO = (CFG && CFG.wsInfo) ? CFG.wsInfo : '';
      if (!WSINFO) { console.warn('[Munchkin] No wsInfo set in 3E config'); }
      var DEBUG = String((CFG && CFG.debugMode) || 'false').toLowerCase() === 'true';

      // Log script name and version on load (only in debug mode)
      if (DEBUG) {
        console.log('[3E_Insights Pixel] v1.0.7');
      }

      // Skip entirely if Munchkin already present on the page (domain-agnostic)
      if (d.querySelector('script[src*="munchkin.marketo.net/munchkin.js"]') ||
          (w.Munchkin && typeof w.Munchkin.init === 'function')) {
        if (DEBUG) console.log('[Munchkin] detected existing instance. Skipping loader.');
        return;
      }
    
      if (w.__mkto_loader_running) { if (DEBUG) console.log('[Munchkin] already running'); return; }
      w.__mkto_loader_running = true;
    
      function dlog(){ if (DEBUG) try{ console.log.apply(console, arguments); }catch(_){} }
      function hasObj(){ return !!(w.Munchkin && typeof w.Munchkin.init === 'function'); }
      function hasTag(){
        var s=d.getElementsByTagName('script');
        for (var i=0;i<s.length;i++){
          var src=(s[i].getAttribute('src')||'').toLowerCase();
          if (src.indexOf('munchkin.marketo.net/munchkin.js')!==-1) return true;
          if (s[i].id==='mkto-munchkin-js') return true;
        }
        return false;
      }
    
      var did=false;
      function initOnce(){
        if (did || !hasObj()) return;
        did = true;
        try{
          var opts = {};
          if (WSINFO) opts.wsInfo = WSINFO;
          dlog('[Munchkin] init', ACCT, opts);
          w.Munchkin.init(ACCT, opts);
        }catch(e){ if (DEBUG) console.error('[Munchkin] init error', e); }
      }
    
      function loadOnce(){
        if (hasTag()) return;
        var s=d.createElement('script');
        s.async=true; s.id='mkto-munchkin-js';
        s.src='https://munchkin.marketo.net/munchkin.js';
        s.onload=initOnce;
        s.onreadystatechange=function(){ if (this.readyState==='loaded'||this.readyState==='complete') initOnce(); };
        (d.head||d.documentElement).appendChild(s);
      }
    
      var poll = setInterval(function(){ if (hasObj()){ clearInterval(poll); initOnce(); } }, 100);
      setTimeout(function(){ clearInterval(poll); }, 5000);
    
      loadOnce();
    })(window, document);
    </script>
