<script>
// Script Name: 3E_3EI Recruiter Conversion
// Author: Anthony Figgins
// Description: Submits a hidden Marketo blind form on 3EI Recruiter email capture using 3E config; lazy-loads Forms2 and ensures tracking cookie.
// Version: 2.3.3
// Date Updated: 2024-12-05
// Dependencies: 3E Config, Marketo Forms2
// Changes: Changed event to rfi_submission with source: 'chatbot_conversion' to match visible forms, ensured placeholder attributes are always set

(function () {
  'use strict';
  // === Pull config once ===
  var CFG;
  try { 
    CFG = {{3E config}}; 
  } catch(e) { 
    CFG = {}; 
  }

  // --- Marketo values ---
  var MKTO_BASE_RAW = CFG && CFG.baseUrl ? String(CFG.baseUrl).trim() : '';
  // Normalize baseUrl - ensure protocol-relative format (//domain.com)
  // Remove http:// or https:// if present, remove trailing slashes, then add //
  var MKTO_BASE = '';
  if (MKTO_BASE_RAW) {
    MKTO_BASE = MKTO_BASE_RAW
      .replace(/^https?:\/\//, '') // Remove http:// or https://
      .replace(/\/+$/, '') // Remove trailing slashes
      .replace(/^\/+/, ''); // Remove leading slashes
    if (MKTO_BASE) {
      MKTO_BASE = '//' + MKTO_BASE; // Add protocol-relative prefix
    }
  }
  var MKTO_ID      = CFG && CFG.munchkinId ? String(CFG.munchkinId).trim() : '';
  var MKTO_DEBUG = CFG && CFG.debugMode === 'true';
  var MKTO_FORM_ID = CFG && CFG.blindFormId ? String(CFG.blindFormId).trim() : '';

  // --- Chatbot values (not used here, but available) ---
  var CHATBOT_PROD = CFG && CFG.chatBotProdId ? CFG.chatBotProdId : '';
  var CHATBOT_DEV  = CFG && CFG.chatBotDevId ? CFG.chatBotDevId : '';

  // Log script name and version on load (only in debug mode)
  if (MKTO_DEBUG) {
    console.log('[3E_ChatBot Conversion] v2.3.3');
  }

  // === Validate required config values ===
  if (!MKTO_BASE) {
    if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] Missing baseUrl in 3E config');
    return;
  }
  if (!MKTO_ID) {
    if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] Missing munchkinId in 3E config');
    return;
  }
  if (!MKTO_FORM_ID) {
    if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] Missing blindFormId in 3E config');
    return;
  }

  // === DataLayer event ===
  var ev = (window.dataLayer && window.dataLayer.length)
    ? window.dataLayer[window.dataLayer.length - 1]
    : {};

  if (!ev || ev.event !== 'bot_email_captured' || !ev.details || !ev.details.email) {
    if (MKTO_DEBUG) console.log('[3E_ChatBot Conversion] No bot_email_captured event found');
    return;
  }

  var email = String(ev.details.email || '').trim();
  if (!email) {
    if (MKTO_DEBUG) console.warn('[3E_ChatBot Conversion] Email is empty');
    return;
  }

  // === Check for existing Marketo forms on the page ===
  var existingForms = document.querySelectorAll('form.mktoForm, form[id^="mktoForm_"]');
  var hasOtherForms = existingForms.length > 0;
  if (hasOtherForms && MKTO_DEBUG) {
    console.log('[3E_ChatBot Conversion] Detected', existingForms.length, 'existing Marketo form(s) on page. Our hidden form will be isolated.');
  }

  // === Ensure hidden form container (unique and isolated) ===
  var ctr = document.getElementById('mkto-hidden-form-conversion');
  if (!ctr) {
    ctr = document.createElement('div');
    ctr.id = 'mkto-hidden-form-conversion';
    ctr.className = 'mkto-hidden-form-container';
    ctr.style.display = 'none';
    ctr.setAttribute('data-mkto-form-purpose', 'hidden-conversion');
    // Ensure body exists before appending
    if (document.body) {
      document.body.appendChild(ctr);
    } else {
      // Wait for DOM to be ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          document.body.appendChild(ctr);
        });
      } else {
        // Fallback: append to documentElement
        document.documentElement.appendChild(ctr);
      }
    }
  }
  
  // Ensure container is connected to DOM
  if (ctr && !document.body.contains(ctr) && !document.documentElement.contains(ctr)) {
    if (document.body) {
      document.body.appendChild(ctr);
    } else if (document.documentElement) {
      document.documentElement.appendChild(ctr);
    }
  }

  // === Loader for Forms2 ===
  function loadForms2(cb, errCb) {
    if (window.MktoForms2) { 
      cb(); 
      return; 
    }
    var s = document.createElement('script');
    s.async = true;
    s.src = MKTO_BASE + '/js/forms2/js/forms2.min.js';
    s.onload = function() {
      if (window.MktoForms2) {
        cb();
      } else {
        if (errCb) errCb(new Error('MktoForms2 not available after script load'));
        else if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] MktoForms2 not available after script load');
      }
    };
    s.onerror = function() {
      var err = new Error('Failed to load Marketo Forms2 script from ' + s.src);
      if (errCb) errCb(err);
      else if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion]', err);
    };
    document.head.appendChild(s);
  }

  // === Ensure tracking cookie (optional) ===
  try {
    if (window.Munchkin && Munchkin.createTrackingCookie) {
      Munchkin.createTrackingCookie(true);
    }
  } catch (e) {
    if (MKTO_DEBUG) console.warn('[Munchkin cookie]', e);
  }

  // === Submit hidden form ===
  loadForms2(
    function () {
      if (!window.MktoForms2) {
        if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] MktoForms2 is not available');
        return;
      }

      if (MKTO_DEBUG) {
        console.log('[3E_ChatBot Conversion] Loading form with config:', {
          baseUrl: MKTO_BASE,
          munchkinId: MKTO_ID,
          formId: MKTO_FORM_ID,
          email: email,
          forms2ScriptUrl: MKTO_BASE + '/js/forms2/js/forms2.min.js'
        });
      }

      // Set a timeout to detect if form never loads
      var formLoadTimeout = setTimeout(function() {
        if (MKTO_DEBUG) {
          console.error('[3E_ChatBot Conversion] Form load timeout - form may not exist or IDs are incorrect');
          console.error('[3E_ChatBot Conversion] Verify form ID', MKTO_FORM_ID, 'exists in Marketo instance', MKTO_BASE);
        }
      }, 10000); // 10 second timeout

      try {
        // Convert form ID to number if it's a string (Marketo accepts both)
        var formIdNum = parseInt(MKTO_FORM_ID, 10);
        if (isNaN(formIdNum)) {
          if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] Invalid form ID (not a number):', MKTO_FORM_ID);
          return;
        }

        // CRITICAL: Create placeholder form element BEFORE calling loadForm
        // This ensures the form has data attributes when Marketo initializes it
        // Marketo's loadForm will attach to this existing element, preserving attributes
        // This guarantees Form Validation can detect it as hidden before whenReady fires
        var placeholderId = 'mktoForm_' + formIdNum;
        var placeholder = ctr.querySelector('#' + placeholderId);
        
        if (!placeholder) {
          placeholder = document.createElement('form');
          placeholder.id = placeholderId;
          placeholder.className = 'mktoForm mktoForm-hidden-conversion';
          placeholder.setAttribute('data-mkto-form-type', 'hidden-conversion');
          placeholder.setAttribute('data-mkto-form-purpose', 'hidden-conversion');
          placeholder.style.visibility = 'hidden';
          placeholder.style.position = 'absolute';
          placeholder.style.left = '-9999px';
          ctr.appendChild(placeholder);
          
          if (MKTO_DEBUG) {
            console.log('[3E_ChatBot Conversion] Created placeholder form element with ID:', placeholderId);
            console.log('[3E_ChatBot Conversion] Placeholder form attributes set for detection');
          }
        } else {
          // Ensure attributes are set even if placeholder already exists
          placeholder.setAttribute('data-mkto-form-type', 'hidden-conversion');
          placeholder.setAttribute('data-mkto-form-purpose', 'hidden-conversion');
          if (MKTO_DEBUG) {
            console.log('[3E_ChatBot Conversion] Placeholder form already exists, ensured attributes are set:', placeholderId);
          }
        }

        // Load form into the hidden container
        // Marketo will attach to the existing placeholder form element
        window.MktoForms2.loadForm(
          MKTO_BASE, 
          MKTO_ID, 
          formIdNum, 
          function (form) {
            clearTimeout(formLoadTimeout);

            // Validate form object
            if (!form) {
              if (MKTO_DEBUG) {
                console.error('[3E_ChatBot Conversion] Form object is null or undefined');
                console.error('[3E_ChatBot Conversion] This usually means the form ID is invalid or the form does not exist');
                console.error('[3E_ChatBot Conversion] Verify form ID', formIdNum, 'exists in Marketo instance', MKTO_BASE, 'with munchkin ID', MKTO_ID);
              }
              return;
            }

            if (MKTO_DEBUG) console.log('[3E_ChatBot Conversion] Form loaded successfully');

            // Get form element for verification and marking
            var formElem = form.getFormElem && form.getFormElem();
            var nativeForm = formElem && formElem.length ? formElem[0] : null;
            
            // CRITICAL: Mark the form element with data attributes for reliable detection
            // This ensures Form Validation can identify it as a hidden conversion form
            if (nativeForm) {
              try {
                nativeForm.setAttribute('data-mkto-form-type', 'hidden-conversion');
                nativeForm.setAttribute('data-mkto-form-purpose', 'hidden-conversion');
                if (MKTO_DEBUG) {
                  console.log('[3E_ChatBot Conversion] Form marked with data attributes for detection');
                }
              } catch (e) {
                if (MKTO_DEBUG) {
                  console.warn('[3E_ChatBot Conversion] Could not set form data attributes:', e);
                }
              }
              
              // Verify form is in our container
              var inContainer = false;
              if (nativeForm.closest && nativeForm.closest('#mkto-hidden-form-conversion')) {
                inContainer = true;
              } else if (ctr && ctr.contains && ctr.contains(nativeForm)) {
                inContainer = true;
              }
              
              if (MKTO_DEBUG) {
                console.log('[3E_ChatBot Conversion] Form ID:', nativeForm.id || 'no-id');
                console.log('[3E_ChatBot Conversion] Form in container:', inContainer);
                console.log('[3E_ChatBot Conversion] Container ID:', ctr ? ctr.id : 'no-container');
                if (!inContainer) {
                  console.warn('[3E_ChatBot Conversion] WARNING: Form may not be in expected container!');
                }
              }
            } else {
              if (MKTO_DEBUG) {
                console.warn('[3E_ChatBot Conversion] Could not get native form element');
              }
            }

            if (MKTO_DEBUG) console.log('[3E_ChatBot Conversion] Setting up handlers for our isolated form instance');
            
            // CRITICAL: Set up onSuccess handler immediately to prevent any navigation/redirect
            // Form Validation will skip this hidden form (see 3E_Form Validation script),
            // so our handler will be the only one for this form instance
            // Returning false prevents default Marketo redirect behavior
            form.onSuccess(function (values, followUpUrl) {
              if (MKTO_DEBUG) {
                console.log('[3E_ChatBot Conversion] Hidden form submitted successfully');
                console.log('[3E_ChatBot Conversion] Email submitted:', email);
                console.log('[3E_ChatBot Conversion] Form values:', values);
                if (followUpUrl) {
                  console.log('[3E_ChatBot Conversion] Follow-up URL prevented:', followUpUrl);
                }
              }
              
              // Push rfi_submission event to dataLayer for GTM tracking
              // Both visible RFI forms and hidden chatbot forms push this event
              // The 'source' property distinguishes chatbot-driven submissions
              try {
                if (typeof window.dataLayer !== 'undefined') {
                  window.dataLayer.push({
                    'event': 'rfi_submission',
                    'email': values.Email || email || null,
                    'formId': nativeForm ? (nativeForm.id || null) : null,
                    'source': 'chatbot_conversion'
                  });
                  if (MKTO_DEBUG) {
                    console.log('[3E_ChatBot Conversion] Pushed rfi_submission event to dataLayer (source: chatbot_conversion)');
                  }
                } else {
                  if (MKTO_DEBUG) {
                    console.warn('[3E_ChatBot Conversion] dataLayer not available, cannot push rfi_submission event');
                  }
                }
              } catch (e) {
                if (MKTO_DEBUG) {
                  console.error('[3E_ChatBot Conversion] Error pushing rfi_submission event:', e);
                }
              }
              
              // Return false to prevent any navigation/redirect
              // This prevents the page from reloading or redirecting after form submission
              return false;
            });
            
            if (MKTO_DEBUG) {
              console.log('[3E_ChatBot Conversion] onSuccess handler registered to prevent page reload');
            }

            // Set followUpUrl to current page as additional safeguard
            try {
              if (form.setFollowUpUrl) {
                form.setFollowUpUrl(window.location.href);
                if (MKTO_DEBUG) console.log('[3E_ChatBot Conversion] Set followUpUrl to current page');
              }
            } catch (e) {
              if (MKTO_DEBUG) console.warn('[3E_ChatBot Conversion] Could not set followUpUrl:', e);
            }

            // Modify form attributes to prevent navigation
            try {
              if (nativeForm) {
                nativeForm.setAttribute('action', 'javascript:void(0)');
                nativeForm.setAttribute('target', '_self');
                if (MKTO_DEBUG) console.log('[3E_ChatBot Conversion] Modified form action to prevent navigation');
              }
            } catch (e) {
              if (MKTO_DEBUG) console.warn('[3E_ChatBot Conversion] Could not modify form element:', e);
            }

            // Handle form errors
            if (form.onError) {
              form.onError(function (error) {
                if (MKTO_DEBUG) {
                  console.error('[3E_ChatBot Conversion] Form submission error:', error);
                  console.error('[3E_ChatBot Conversion] Error details:', JSON.stringify(error));
                }
              });
            }

            // Set form values - must be done before submission
            try {
              form.vals({ Email: email });
              if (MKTO_DEBUG) {
                console.log('[3E_ChatBot Conversion] Email set in form:', email);
                // Verify the value was set
                var setValues = form.vals();
                if (MKTO_DEBUG && setValues) {
                  console.log('[3E_ChatBot Conversion] Form values after setting:', setValues);
                }
              }
            } catch (e) {
              if (MKTO_DEBUG) {
                console.error('[3E_ChatBot Conversion] Error setting form values:', e);
                console.error('[3E_ChatBot Conversion] Error stack:', e.stack);
              }
              return;
            }

            // Wait for form to be fully rendered and ready before submitting
            // The loadForm callback provides a form that should be ready, but we verify
            // This ensures all handlers are set up and form is submittable
            var submitAttempts = 0;
            var maxSubmitAttempts = 50; // 5 seconds max (50 * 100ms)
            
            function attemptSubmit() {
              submitAttempts++;
              var formElement = form.getFormElem && form.getFormElem();
              var nativeFormElement = formElement && formElement.length ? formElement[0] : null;
              var formInDOM = false;
              
              if (nativeFormElement) {
                // Check if form is in DOM
                if (nativeFormElement.isConnected !== undefined) {
                  formInDOM = nativeFormElement.isConnected;
                } else {
                  // Fallback check
                  try {
                    formInDOM = document.body.contains(nativeFormElement) || 
                               document.documentElement.contains(nativeFormElement) ||
                               (ctr && ctr.contains && ctr.contains(nativeFormElement));
                  } catch(e) {
                    formInDOM = false;
                  }
                }
              }
              
              // If form not in DOM yet, wait a bit more
              if (!formInDOM && submitAttempts < maxSubmitAttempts) {
                if (MKTO_DEBUG && submitAttempts % 10 === 0) {
                  console.log('[3E_ChatBot Conversion] Waiting for form to be in DOM, attempt', submitAttempts);
                }
                setTimeout(attemptSubmit, 100);
                return;
              }
              
              // Submit the form
              try {
                if (MKTO_DEBUG) {
                  console.log('[3E_ChatBot Conversion] Attempting to submit hidden form for:', email);
                  console.log('[3E_ChatBot Conversion] Form in DOM:', formInDOM);
                }
                
                // Ensure form is submittable before attempting submission
                if (form.submittable && typeof form.submittable === 'function') {
                  var wasSubmittable = form.submittable();
                  form.submittable(true);
                  if (MKTO_DEBUG) {
                    console.log('[3E_ChatBot Conversion] Form submittable status - was:', wasSubmittable, 'now:', form.submittable());
                  }
                }
                
                // Submit the form - Marketo handles the actual submission
                form.submit();
                
                if (MKTO_DEBUG) {
                  console.log('[3E_ChatBot Conversion] Form submit() called successfully');
                  console.log('[3E_ChatBot Conversion] Waiting for onSuccess callback...');
                }
                
                // Set a timeout to warn if onSuccess never fires
                setTimeout(function() {
                  if (MKTO_DEBUG) {
                    console.warn('[3E_ChatBot Conversion] No onSuccess callback received after 5 seconds - form submission may have failed or handler not registered');
                  }
                }, 5000);
                
              } catch (e) {
                if (MKTO_DEBUG) {
                  console.error('[3E_ChatBot Conversion] Error submitting form:', e);
                  console.error('[3E_ChatBot Conversion] Error stack:', e.stack);
                }
              }
            }
            
            // Start submission attempt after a delay to ensure:
            // 1. Handlers are registered
            // 2. Form Validation has had a chance to skip our form (if it runs)
            // 3. Form is fully rendered in the DOM
            // Using a small delay to allow any pending DOM operations to complete
            setTimeout(attemptSubmit, 300);
          },
          ctr // Specify the container element for the hidden form
        );
      } catch (e) {
        clearTimeout(formLoadTimeout);
        if (MKTO_DEBUG) {
          console.error('[3E_ChatBot Conversion] Exception loading form:', e);
          console.error('[3E_ChatBot Conversion] Config values:', {
            baseUrl: MKTO_BASE,
            munchkinId: MKTO_ID,
            formId: MKTO_FORM_ID
          });
        }
      }
    },
    function (err) {
      if (MKTO_DEBUG) console.error('[3E_ChatBot Conversion] Failed to load Forms2 script:', err);
    }
  );
})();
</script>
