name: Deploy Updates to S3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1
  S3_BUCKET: 3e-gtm-tag-management  # Replace with your bucket name
  CLOUDFRONT_DISTRIBUTION_ID: E1234567890ABC  # Replace with your CloudFront distribution ID

jobs:
  package-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Read version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          elif [ -f web/package.json ]; then
            VERSION=$(node -p "require('./web/package.json').version")
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create release package
        run: |
          # Create a clean package (exclude unnecessary files)
          mkdir -p release-package
          
          # Copy all files except those in .gitignore
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.cache' \
            --exclude='.backup' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.DS_Store' \
            --exclude='automation/gtm-oauth-credentials.json' \
            --exclude='automation/token.json' \
            --exclude='.env' \
            . release-package/
          
          # Create ZIP file
          cd release-package
          zip -r ../eee-tag-management-${{ steps.version.outputs.version }}.zip .
          cd ..
          
          # Calculate SHA-256 checksum
          sha256sum eee-tag-management-${{ steps.version.outputs.version }}.zip > eee-tag-management-${{ steps.version.outputs.version }}.sha256
          CHECKSUM=$(cat eee-tag-management-${{ steps.version.outputs.version }}.sha256 | awk '{print $1}')
          echo "checksum=sha256:$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: sha256:$CHECKSUM"
      
      - name: Get file size
        id: filesize
        run: |
          SIZE=$(stat -f%z eee-tag-management-${{ steps.version.outputs.version }}.zip 2>/dev/null || stat -c%s eee-tag-management-${{ steps.version.outputs.version }}.zip)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "File size: $SIZE bytes"
      
      - name: Create version manifest
        run: |
          cat > manifest.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "release_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "download_url": "https://${CLOUDFRONT_DISTRIBUTION_ID}.cloudfront.net/releases/v${{ steps.version.outputs.version }}/eee-tag-management-${{ steps.version.outputs.version }}.zip",
            "checksum": "${{ steps.checksum.outputs.checksum }}",
            "size": ${{ steps.filesize.outputs.size }},
            "changelog": "See GitHub releases for changelog",
            "min_python_version": "3.10",
            "min_node_version": "18.0"
          }
          EOF
          cat manifest.json
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Upload to S3
        run: |
          # Upload ZIP file
          aws s3 cp eee-tag-management-${{ steps.version.outputs.version }}.zip \
            s3://${S3_BUCKET}/releases/v${{ steps.version.outputs.version }}/eee-tag-management-${{ steps.version.outputs.version }}.zip \
            --content-type application/zip
          
          # Upload checksum
          aws s3 cp eee-tag-management-${{ steps.version.outputs.version }}.sha256 \
            s3://${S3_BUCKET}/checksums/v${{ steps.version.outputs.version }}.sha256 \
            --content-type text/plain
          
          # Upload version manifest
          aws s3 cp manifest.json \
            s3://${S3_BUCKET}/manifests/v${{ steps.version.outputs.version }}.json \
            --content-type application/json
          
          # Update latest manifest
          aws s3 cp manifest.json \
            s3://${S3_BUCKET}/manifests/latest.json \
            --content-type application/json
          
          # Create symlink for latest release (S3 doesn't support symlinks, so we copy)
          aws s3 cp s3://${S3_BUCKET}/releases/v${{ steps.version.outputs.version }}/eee-tag-management-${{ steps.version.outputs.version }}.zip \
            s3://${S3_BUCKET}/releases/latest/eee-tag-management-latest.zip \
            --content-type application/zip
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/manifests/latest.json" "/manifests/v${{ steps.version.outputs.version }}.json" "/releases/v${{ steps.version.outputs.version }}/*"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Changes
            
            See commit history for details.
            
            ## Installation
            
            The update will be automatically applied when you run `start-web.py`.
            
            Or download manually:
            - ZIP: [eee-tag-management-${{ steps.version.outputs.version }}.zip](https://${CLOUDFRONT_DISTRIBUTION_ID}.cloudfront.net/releases/v${{ steps.version.outputs.version }}/eee-tag-management-${{ steps.version.outputs.version }}.zip)
            - Checksum: `${{ steps.checksum.outputs.checksum }}`
          files: |
            eee-tag-management-${{ steps.version.outputs.version }}.zip
            eee-tag-management-${{ steps.version.outputs.version }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
